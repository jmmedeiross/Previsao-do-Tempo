services:
  - type: web
    name: previsao-do-tempo-jmmedeiross
    runtime: node
    plan: free
    buildCommand: npm install --ignore-scripts
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENWEATHER_API_KEY
        sync: false
