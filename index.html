<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Mantém os links antigos do GitHub Pages apontando para o serviço atual.
      if (window.location.hostname === "jmmedeiross.github.io") {
        window.location.replace("https://previsao-do-tempo-jmmedeiross.onrender.com/");
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <title>Previsão do Tempo</title>
  </head>
  <body>
    <div class="caixa-maior">
      <input aria-label="Cidade" class="input-cidade" placeholder="Digite o nome da cidade" />
      <button class="botao-busca" onclick="cliqueiNoBotao()">
        <img
          class="img-busca"
          src="https://www.svgrepo.com/show/488200/find.svg"
          alt="busca"
        />
      </button>
      <p id="status" role="status" aria-live="polite">Busque uma cidade para consultar o clima.</p>
      <div class="caixa-media">
        <h2 class="temp-cidade">Previsão do tempo</h2>

        <p class="temp">—</p>
        <div class="caixa-menor">
          <span class="img-previsao" role="img" aria-label="Condição do tempo">☁️</span>
          <p class="texto-previsao">—</p>
        </div>
      </div>
      <p class="umidade">Umidade: —</p>
      <p class="fonte">Dados: <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a> · Localização: <a href="https://www.geonames.org/" target="_blank" rel="noopener noreferrer">GeoNames</a></p>
    </div>
  </body>
</html>
